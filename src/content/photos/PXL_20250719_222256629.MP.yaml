title: Looking toward the up direction at Fassifern on the footbridge
detail: >-
  Looking over a station from a footbridge, a pair of tracks are visible that 
  extend into a curve in the distance with a pair of platform on either side.
  Steel wire gantries are visible at regular intervals on along the platform.
  There is a small commuter carpark visible on the left outside the station, and
  the whole place is surrounded by trees and bushland. The sky is a clear blue
  colour. 
