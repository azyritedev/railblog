title: B7 on the up at Summer Hill for a City Circle service
detail: >-
  The orange and black front of a Waratah Series 2 train pulling into platform 2
  at Summer Hill station. The destination board reads "City Circle". On the 
  platform, a couple people are visible, waiting for the train to stop. The sky 
  above is overcast.
notes: >-
  Notice how both sets of headlights have been replaced by mismatched A-set coloured ones.
