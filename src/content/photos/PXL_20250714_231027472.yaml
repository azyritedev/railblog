title: XPT power car 2008 at Central platform 1
detail: >-
  A blue, yellow and white liveried XPT power car "2008" sitting at the platform
  with six passenger cars visible behind it. A display board mounted to the roof
  of the platform informs passengers "Do not board" as "This train is not in service."
  The sky is overcast and the lighting is even.
