title: Coal trains passing each other at Maitland
detail: >-
  Two very long trains made of coal hoppers passing each other, with a platform visible
  in the middle of the frame. The train on the left is moving away from the camera
  with hoppers full of coal while the train on the right is moving toward the camera
  with empty hoppers. The sky is bright and clear. 
