detail: >-
  Looking at a double-decker silver "Tangara" suburban train with a distinct slanted
  yellow front and yellow doors. A fence is visible in the foreground and grey steel 
  bridge pieces are visible at regular intervals to the right of the train. The 
  surfaces around the train are wet and the sky is a dull white colour.
