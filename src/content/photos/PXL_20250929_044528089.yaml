title: Interior of one-of-a-kind Contura car with longitudinal seating 
tags:
  - v-set
  - interior
notes: >-
  This photo shows the inside of the unique "Contura" car, DET9216 as part of V25.
  This car was originally converted into a special charter car but later returned
  to regular service, with its unique vestibule left intact. A couple days prior
  to this photo, this carriage was unfortunately heavily vandalised, and the marks 
  are still faintly visible on the chairs in this photo.
detail: >-
  Looking into the vestible area of a converted driving trailer of a V-set, the 
  purple interior is brightly lit by sunshine and four bush plum colorued
  seats face inward, two on each side forming a longitudinal seating arrangement.
  Some faint marks of cleaned graffiti are visible on the chairs. 
