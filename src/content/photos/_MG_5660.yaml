title: Exterior doors of DCT 9040 
detail: >-
  The doorway of a train carriage taken as the train is moving at speed as indicated
  by the blurred outside visible through the windows on the yellow doors. To the
  left wall next the doors a detailed map of the "Sydney rail network" is visible
  along with some general public transport notice stickers. There are grab handles
  on both sides of the doorway, and the walls are painted a unique purple colour. 
notes: >- 
  This is taken from one of the converted driver cars of V27, while I think I
  remember it as 9040 there is a possibility it could be DCT 9031. No promises!
