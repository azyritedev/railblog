title: Signals ST14L on the gantry at Summer Hill showing green on green
detail: >-
  A set of railway signals mounted on an overhead steel support, made up of two
  sections, the top section with two lights displaying green and the bottom 
  section with four lights also displaying green, forming a green on green 
  "proceed" status.
notes: >-
  There is a smaller "Close Up" light at the bottom of the lights that isn't on 
  at the moment. These are more common closer to the city or in busier parts of 
  the network.
approxLocation: Summer Hill
author: azyrite
