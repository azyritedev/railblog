title: V46 pulls into Katoomba on the up
detail: >-
  V46 pulls into platform 1 at Katoomba Station on the curve
notes: >-
  This train would later reverse, running express to Mt. Victoria and then all 
  stations back to Katoomba, then express to Central due to V1 striking a tree on
  the overhead wire near Zig Zag causing a thirty minute delay for this run.
