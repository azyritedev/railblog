title: Armidale/Moree Xplorer service led by 2505 entering Wondabyne
detail: >-
  The front of a yellow and blue Xplorer train can be seen entering the small
  station of Wondabyne, passing under a wire gantry. It is a bright sunny day 
  and green hills are visible in the background along with Mullet Creek.
notes: Do they ever put on the coupler protecters?
