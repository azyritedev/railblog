title: DIT 9136 with all but one of its external door windows kicked out
detail: >-
  The windows in the external doors of V set carriage DIT 9136 have all been 
  vandalised except one. The doors closest to the camera are ajar, showing the
  other set of doors having their windows replaced with a temporary steel cover.
