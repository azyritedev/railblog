title: Open gangway between converted driving trailers DCT 9031 & 9040 of V27
detail: >-
  The view of the door to the other carriage over an open gangway. The door is 
  a greyish colour with a heavily scratched and unclear window and small handle.
  The gangway has shiny protective blockers on the side attached to each carriage
  to prevent people from falling from the train. The interior of the carriage the
  shot is taken from is painted purple. The lighting is mostly even, and warmer
  within the carriage.
