title: B2 in the rain at Redfern on the down
detail: >-
  A Waratah Series 2 train with an orange and black front and a mismatched left
  headlight pulls into Redfern station in the rain while another B set sits on the
  platform opposite. The destination board reads "Homebush via Strathfield".
notes: >-
  This is one of a couple of B sets I saw today with what appears to be a headlight
  taken from an A set looking at the mismatched paint colour.
