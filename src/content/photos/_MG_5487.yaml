title: A01 running a Central via Eastwood service at Berowra due to trackwork
notes: This is a T9 service at Berowra due to trackwork that day
detail: >-
  A modern double-decker suburban train with a yellow front and a silver body,
  with yellow highlights around the doors and dark windows at a platform.
  The destination board on the front above the windshield reads "Central via 
  Eastwood". All 8 carriages of the train are visible. Another platform which the 
  photographer is standing on is visible in the shot as well. In the background
  there is a footbridge over the tracks and some trees. Overhead wiring is
  visible in the top of the frame as well as a wire gantry toeard the middle of 
  the platform supporting these wires. THe sky is a blue colour and it is bright
  daylight.
