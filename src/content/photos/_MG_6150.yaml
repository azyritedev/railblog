title: D51 leading a 10-car Mariyung test train up through Mount Victoria
tags:
  - d-set
  - bmt
detail: >-
  A 10-car D set lead by D51 slowly proceeds through the platform at Mt. Victoria
  as a test train on the BMT, to be introduced into passenger service shortly.
notes: >-
  At the time of editing this photo, the first revenue Mariyung service on the
  mountains is expected to be on Monday the 13th, marking the beginning of the end
  of V sets on the BMT.
